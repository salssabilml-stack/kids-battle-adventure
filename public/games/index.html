<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Game</title><style>html,body{margin:0;height:100%;background:#111827;color:white;font-family:system-ui;overflow:hidden}#hud{position:fixed;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;z-index:2}.pill{background:#020617cc;border:1px solid #475569;border-radius:999px;padding:8px 12px}canvas{width:100vw;height:100vh;display:block}.overlay{position:fixed;inset:auto 20px 20px 20px;background:#020617cc;border:1px solid #475569;border-radius:18px;padding:12px;text-align:center}button{background:#2563eb;color:white;border:0;border-radius:12px;padding:10px 14px;font:inherit}</style></head><body><div id="hud"><div class="pill" id="title"></div><div class="pill" id="score">Score 0</div></div><canvas id="game"></canvas><div class="overlay">Arrow keys / WASD or tap to move. <button onclick="restart()">Restart</button></div><script>
const catalog={
'star-defender':['Action','#60a5fa'], 'ninja-dash':['Action','#f87171'], 'slime-arena':['Action','#4ade80'], 'mech-blaster':['Action','#818cf8'], 'pirate-cannon':['Action','#fb7185'],
'kart-sprint':['Racing','#facc15'], 'hover-rush':['Racing','#22d3ee'], 'turbo-tunnel':['Racing','#fb7185'], 'rocket-rally':['Racing','#f97316'], 'drift-city':['Racing','#2dd4bf'],
'gem-match':['Puzzle','#a78bfa'], 'number-pop':['Puzzle','#34d399'], 'maze-lite':['Puzzle','#fbbf24'], 'color-switcher':['Puzzle','#f472b6'], 'block-stack':['Puzzle','#93c5fd'],
'obby-cloud-hop':['Obby','#93c5fd'], 'lava-steps':['Obby','#f97316'], 'sky-bridge':['Obby','#c084fc'], 'crystal-climb':['Obby','#67e8f9'], 'moon-bounce':['Obby','#e879f9']};
const id=new URLSearchParams(location.search).get('game')||'star-defender', type=(catalog[id]||catalog['star-defender'])[0], accent=(catalog[id]||catalog['star-defender'])[1];
title.textContent=id.replaceAll('-',' ').replace(/\b\w/g,m=>m.toUpperCase())+' · '+type; const c=document.getElementById('game'),ctx=c.getContext('2d');let w,h,score=0,t=0,player,items,keys={};
function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();
function restart(){score=0;t=0;player={x:w/2,y:h/2,r:18*devicePixelRatio,vx:0,vy:0};items=Array.from({length:type==='Puzzle'?9:18},(_,i)=>spawn(i));}
function spawn(i){return{x:Math.random()*w,y:80*devicePixelRatio+Math.random()*(h-140*devicePixelRatio),r:(12+Math.random()*15)*devicePixelRatio,c:i%3===0?accent:i%3===1?'#fbbf24':'#34d399',hit:false,n:i+1}}
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('pointermove',e=>{player.x=e.clientX*devicePixelRatio;player.y=e.clientY*devicePixelRatio});
function loop(){requestAnimationFrame(loop);t++;ctx.fillStyle='#111827';ctx.fillRect(0,0,w,h);ctx.save();ctx.globalAlpha=.35;for(let i=0;i<28;i++){ctx.strokeStyle=i%2?accent:'#334155';ctx.beginPath();ctx.arc(w/2,h/2,(i*40+(t*(type==='Racing'?9:2)))%(Math.max(w,h)),0,7);ctx.stroke()}ctx.restore();
 let speed=(type==='Racing'?8:5)*devicePixelRatio;player.x+=((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0))*speed;player.y+=((keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0))*speed;player.x=Math.max(player.r,Math.min(w-player.r,player.x));player.y=Math.max(70*devicePixelRatio,Math.min(h-player.r,player.y));
 items.forEach((it,i)=>{if(type==='Action'){it.y+=Math.sin((t+i*17)/22)*.8*devicePixelRatio;it.x+=Math.cos((t+i)/60)*1.6*devicePixelRatio}if(type==='Racing'){it.y+=4*devicePixelRatio;if(it.y>h)Object.assign(it,spawn(i),{y:70*devicePixelRatio})}if(type==='Obby'&&i%2){it.x+=Math.sin(t/30+i)*2*devicePixelRatio}ctx.fillStyle=it.c;ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,7);ctx.fill();if(type==='Puzzle'){ctx.fillStyle='#020617';ctx.font=16*devicePixelRatio+'px system-ui';ctx.fillText(it.n,it.x-5*devicePixelRatio,it.y+5*devicePixelRatio)}let dx=it.x-player.x,dy=it.y-player.y;if(Math.hypot(dx,dy)<it.r+player.r){score+=type==='Puzzle'?it.n*5:10;Object.assign(it,spawn(i));window.parent?.postMessage({event:'score_submitted',gameId:id,score},'*')}});
 ctx.fillStyle=accent;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3*devicePixelRatio;ctx.stroke();document.getElementById('score').textContent='Score '+score;}
restart();window.parent?.postMessage({event:'ready',gameId:id},'*');loop();
</script></body></html>
